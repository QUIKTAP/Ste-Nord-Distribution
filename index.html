<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SND Premium</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #0b1622;
    font-family: Arial, sans-serif;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Waves */
.wave {
    position: absolute;
    width: 200%;
    height: 200px;
    background: rgba(107,142,35,0.15);
    bottom: 0;
    left: 0;
    border-radius: 40%;
    animation: wave 8s linear infinite;
}

.wave:nth-child(2) {
    bottom: 20px;
    animation-duration: 12s;
    opacity: 0.4;
}

@keyframes wave {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
}

/* Card */
.card {
    position: relative;
    z-index: 10;
    width: 350px;
    padding: 25px;
    border-radius: 25px;
    background: linear-gradient(145deg, #162635, #0f1e2e);
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
    text-align: center;
}

/* Logo */
.logo img {
    width: 100px;
    border-radius: 50%;
    border: 3px solid #6b8e23;
    box-shadow: 0 0 15px rgba(107,142,35,0.6);
}

/* Text */
.name {
    margin-top: 15px;
    font-size: 24px;
    font-weight: bold;
    color: #c8d66b;
}

.role {
    opacity: 0.8;
    margin-bottom: 10px;
}

.desc {
    font-size: 14px;
    opacity: 0.85;
    margin-bottom: 15px;
}

/* Buttons */
.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 10px auto;
    padding: 12px;
    border-radius: 12px;
    width: 90%;
    text-decoration: none;
    color: white;
    background: linear-gradient(90deg, #556b2f, #6b8e23);
    box-shadow: 0 5px 15px rgba(107,142,35,0.4);
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
}

.btn i {
    font-size: 16px;
}

/* Footer */
.footer {
    margin-top: 15px;
    font-size: 12px;
    opacity: 0.6;
}

</style>
</head>

<body>

<div class="wave"></div>
<div class="wave"></div>

<div class="card">

    <div class="logo">
        <img src="logo.png" alt="SND Logo">
    </div>

    <div class="name">Mounir Ben El Aid</div>
    <div class="role">Gérant</div>

    <div class="desc">
        Vente fournitures de bureau<br>
        Matériel consommable informatique
    </div>

    <a href="tel:+21695145130" class="btn">
        <i class="fa-solid fa-phone"></i> Appeler
    </a>

    <a href="mailto:snd.nord2014@yahoo.com" class="btn">
        <i class="fa-solid fa-envelope"></i> Email
    </a>

    <a href="https://wa.me/21650462267" class="btn">
        <i class="fa-brands fa-whatsapp"></i> WhatsApp
    </a>

    <a href="https://maps.google.com/?q=9 Rue de l’Indépendance Denden Manouba" target="_blank" class="btn">
        <i class="fa-solid fa-location-dot"></i> Voir sur la carte
    </a>

    <a href="contact.vcf" class="btn">
        <i class="fa-solid fa-address-book"></i> Ajouter au contacts
    </a>

    <div class="footer">Powered by KLYX</div>

</div>

</body>
</html>
